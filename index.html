<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Straight Freight – Orders Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#05070b;
  --card:#0f1420;
  --text:#e6edf6;
  --muted:#93a4b7;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --border:#1f2933;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(1200px 800px at 10% -10%, #121a2b 0%, transparent 60%), var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:420px;
  background:linear-gradient(180deg,#111827,#0b1220);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

h1{
  margin:0 0 16px;
  font-size:20px;
}

label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-top:12px;
}

input{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
}

button{
  width:100%;
  margin-top:18px;
  padding:12px;
  border-radius:12px;
  border:none;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  margin-top:16px;
  font-size:13px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="card">
  <h1>Straight Freight – Orders Export</h1>

  <label>Start Date</label>
  <input type="date" id="startDate" />

  <label>End Date</label>
  <input type="date" id="endDate" />

  <button id="startBtn">Start Pull</button>

  <div class="status" id="status">Idle</div>
</div>

<script>
const btn = document.getElementById("startBtn");
const statusEl = document.getElementById("status");

const addDays = (date, days) => {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
};

const fmt = (d) => d.toISOString().slice(0,10);

btn.onclick = async () => {
  const startVal = document.getElementById("startDate").value;
  const endVal = document.getElementById("endDate").value;

  if (!startVal || !endVal) {
    alert("Please select both dates.");
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "Starting…";

  let cursor = new Date(startVal);
  const finalEnd = new Date(endVal);

  let totalOrders = 0;

  while (cursor <= finalEnd) {
    const batchStart = new Date(cursor);
    let batchEnd = addDays(batchStart, 29);
    if (batchEnd > finalEnd) batchEnd = new Date(finalEnd);

    const from = fmt(batchStart);
    const to = fmt(batchEnd);

    statusEl.textContent = `Pulling ${from} → ${to} (Orders so far: ${totalOrders})`;

    const res = await fetch(`/api/get-orders?from=${from}&to=${to}`);
    const data = await res.json();

    if (Array.isArray(data.orders)) {
      totalOrders += data.orders.length;
    }

    // advance cursor to NEXT DAY after batch end
    cursor = addDays(batchEnd, 1);
  }

  statusEl.textContent = `Completed. Total Orders: ${totalOrders}`;
  btn.disabled = false;
};
</script>
</body>
</html>
