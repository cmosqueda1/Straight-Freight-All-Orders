<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Straight Freight – Orders Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#05070b;
  --card:#0f1420;
  --text:#e6edf6;
  --muted:#93a4b7;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --border:#1f2933;
  --ok:#10b981;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1200px 800px at 10% -10%, #121a2b 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:460px;
  background:linear-gradient(180deg,#111827,#0b1220);
  border:1px solid var(--border);
  border-radius:20px;
  padding:26px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
}
h1{margin:0 0 20px;font-size:20px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
input[type="date"]{
  width:100%;
  padding:12px 44px 12px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
}
input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:1;
  filter:invert(1);
}
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:600;
  cursor:pointer;
  color:#fff;
}
.primary{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.secondary{background:linear-gradient(90deg,#334155,#475569)}
.progress-wrap{margin-top:18px;display:none}
.progress-bar{
  height:10px;
  background:#0b1220;
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--ok));
  transition:width .3s ease;
}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid #334155;
  border-top-color:#22d3ee;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>

<body>
<div class="card">
  <h1>Straight Freight – Orders Export</h1>

  <label>Start Date</label>
  <input type="date" id="startDate">

  <label style="margin-top:12px">End Date</label>
  <input type="date" id="endDate">

  <button id="startBtn" class="primary" style="margin-top:18px">
    Start Pull
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="status" id="status">
      <span class="spinner"></span>Starting…
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <button id="exportBtn" class="secondary" style="display:none;margin-top:16px">
    Export CSV
  </button>

  <div class="footer" id="summary"></div>
</div>

<script>
/* =====================
   CSV COLUMN ORDER
===================== */
const CSV_COLUMNS = [
  "OrderTrackingID","TrackingKey","QuoteId","AltRefId","RouteNo","AccountNo",
  "ClientRefNo","ClientRefNo2","ClientRefNo3","ClientRefNo4",

  "OrderStatus","OrderShipmentStatusCodes","oDate","PickupETA","DeliveryETA",

  "PickupAddress","PickupTargetFrom","PickupTargetTo",
  "PickupArrival","PickupDeparture","POPname","HasPOPsignature",

  "DeliveryAddress","DeliveryTargetFrom","DeliveryTargetTo",
  "DeliveryArrival","DeliveryDeparture","PODname","HasPODsignature",

  "DriverId","DriverNo","DriverFirstName","DriverLastName","Vehicle","VehiclePic",

  "ShipmentWeight","OrderPackages","OrderPackageItems","DeclaredValue","CODAmount",

  "OrderCharge","PackageCharge","WeightCharge","DeclaredValueCharge","CODCharge",
  "AfterHoursCharge","WaitTimeCharge","StopOffCharge","MiscCharge",
  "TotalExtras","TotalSurcharges","Subtotal","Tax1Amount","Tax2Amount","GrandTotal",

  "SpecInstr","OrderSpecialInstructions","Comments",
  "Department","CallerName","Phone","Email",

  "LastGPS","CreditCard","HasPLI","HasDLI"
];

/* =====================
   STATE / HELPERS
===================== */
const BATCH_SIZE = 5;
let allOrders = [];
let startTime = null;
let timerInterval = null;

const parseLocal = v => {
  const [y,m,d] = v.split("-").map(Number);
  return new Date(y,m-1,d);
};
const addDays = (d,n) => {
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
};
const fmt = d => d.toISOString().slice(0,10);
const elapsed = () => {
  const s = Math.floor((Date.now()-startTime)/1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
};

/* =====================
   ELEMENTS
===================== */
const startBtn = document.getElementById("startBtn");
const exportBtn = document.getElementById("exportBtn");
const statusEl = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const summaryEl = document.getElementById("summary");

/* =====================
   MAIN
===================== */
startBtn.onclick = async () => {
  if (!startDate.value || !endDate.value) {
    return alert("Select both dates");
  }

  startBtn.disabled = true;
  exportBtn.style.display = "none";
  progressWrap.style.display = "block";
  progressFill.style.width = "0%";
  allOrders = [];
  summaryEl.textContent = "";

  startTime = Date.now();
  timerInterval = setInterval(() => {
    statusEl.innerHTML =
      `<span class="spinner"></span>` +
      `Running… Orders: ${allOrders.length} | Elapsed: ${elapsed()}`;
  }, 1000);

  let windows = [];
  let cursor = parseLocal(startDate.value);
  const end = parseLocal(endDate.value);

  while (cursor <= end) {
    const from = new Date(cursor);
    let to = addDays(from,29);
    if (to > end) to = new Date(end);
    windows.push({from:fmt(from), to:fmt(to)});
    cursor = addDays(to,1);
  }

  let completed = 0;

  for (let i=0;i<windows.length;i+=BATCH_SIZE) {
    const slice = windows.slice(i,i+BATCH_SIZE);
    const results = await Promise.all(
      slice.map(w =>
        fetch(`/api/get-orders?from=${w.from}&to=${w.to}`)
          .then(r => r.json())
      )
    );

    results.forEach(r => {
      if (Array.isArray(r.orders)) allOrders.push(...r.orders);
    });

    completed += slice.length;
    progressFill.style.width =
      Math.round((completed/windows.length)*100) + "%";
  }

  clearInterval(timerInterval);
  statusEl.textContent = `Completed in ${elapsed()}`;
  progressFill.style.width = "100%";
  summaryEl.textContent = `Completed. Total Orders: ${allOrders.length}`;
  exportBtn.style.display = "block";
  startBtn.disabled = false;
};

/* =====================
   EXPORT
===================== */
exportBtn.onclick = () => {
  if (!allOrders.length) return;

  const rows = [
    CSV_COLUMNS.join(","),
    ...allOrders.map(o =>
      CSV_COLUMNS.map(c =>
        `"${String(o?.[c] ?? "").replace(/"/g,'""')}"`
      ).join(",")
    )
  ];

  const blob = new Blob([rows.join("\n")], { type:"text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "straight_freight_orders.csv";
  a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
