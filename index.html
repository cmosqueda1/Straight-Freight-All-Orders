<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Straight Freight – Orders Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#05070b;
  --card:#0f1420;
  --text:#e6edf6;
  --muted:#93a4b7;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --border:#1f2933;
  --ok:#10b981;
  --warn:#facc15;
  --bad:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1200px 800px at 10% -10%, #121a2b 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:460px;
  background:linear-gradient(180deg,#111827,#0b1220);
  border:1px solid var(--border);
  border-radius:20px;
  padding:26px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
}
h1{margin:0 0 20px;font-size:20px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
input[type="date"]{
  width:100%;
  padding:12px 44px 12px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
}
input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:1;
  filter:invert(1);
}
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:600;
  cursor:pointer;
  color:#fff;
}
.primary{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.secondary{background:linear-gradient(90deg,#334155,#475569)}
.progress-wrap{margin-top:18px;display:none}
.progress-bar{
  height:10px;
  background:#0b1220;
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--ok));
  transition:width .3s ease;
}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid #334155;
  border-top-color:#22d3ee;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{
  margin-top:14px;
  font-size:13px;
  color:var(--muted);
  text-align:left;
  max-height:160px;
  overflow:auto;
}
.footer .ok{color:var(--ok)}
.footer .warn{color:var(--warn)}
.footer .bad{color:var(--bad)}
</style>
</head>

<body>
<div class="card">
  <h1>Straight Freight – Orders Export</h1>

  <label>Start Date</label>
  <input type="date" id="startDate">

  <label style="margin-top:12px">End Date</label>
  <input type="date" id="endDate">

  <button id="startBtn" class="primary" style="margin-top:18px">
    Start Pull
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="status" id="status">
      <span class="spinner"></span>Starting…
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <button id="exportBtn" class="secondary" style="display:none;margin-top:16px">
    Export CSV
  </button>

  <div class="footer" id="summary"></div>
</div>

<script>
/* =====================
   CONFIG
===================== */
const BATCH_SIZE = 5;
const MAX_RETRIES = 2;

/* =====================
   STATE
===================== */
let allOrders = [];
let startTime = null;
let timerInterval = null;
let failureLog = [];

/* =====================
   HELPERS
===================== */
const parseLocal = v => {
  const [y,m,d] = v.split("-").map(Number);
  return new Date(y,m-1,d);
};
const addDays = (d,n) => {
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
};
const fmt = d => d.toISOString().slice(0,10);
const elapsed = () => {
  const s = Math.floor((Date.now()-startTime)/1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* =====================
   ELEMENTS
===================== */
const startBtn = document.getElementById("startBtn");
const exportBtn = document.getElementById("exportBtn");
const statusEl = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const summaryEl = document.getElementById("summary");

/* =====================
   FETCH WITH RETRY
===================== */
async function fetchWithRetry(from, to) {
  let attempts = 0;

  while (attempts <= MAX_RETRIES) {
    try {
      const res = await fetch(`/api/get-orders?from=${from}&to=${to}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return { success:true, attempts, data };
    } catch (err) {
      attempts++;
      if (attempts > MAX_RETRIES) {
        return { success:false, attempts };
      }
      await sleep(750);
    }
  }
}

/* =====================
   MAIN
===================== */
startBtn.onclick = async () => {
  if (!startDate.value || !endDate.value) {
    return alert("Select both dates");
  }

  startBtn.disabled = true;
  exportBtn.style.display = "none";
  progressWrap.style.display = "block";
  progressFill.style.width = "0%";
  summaryEl.innerHTML = "";
  allOrders = [];
  failureLog = [];

  startTime = Date.now();
  timerInterval = setInterval(() => {
    statusEl.innerHTML =
      `<span class="spinner"></span>` +
      `Running… Orders: ${allOrders.length} | Elapsed: ${elapsed()}`;
  }, 1000);

  let windows = [];
  let cursor = parseLocal(startDate.value);
  const end = parseLocal(endDate.value);

  while (cursor <= end) {
    const from = new Date(cursor);
    let to = addDays(from,29);
    if (to > end) to = new Date(end);
    windows.push({from:fmt(from), to:fmt(to)});
    cursor = addDays(to,1);
  }

  let completed = 0;

  for (let i=0;i<windows.length;i+=BATCH_SIZE) {
    const slice = windows.slice(i,i+BATCH_SIZE);

    const results = await Promise.all(
      slice.map(w => fetchWithRetry(w.from, w.to))
    );

    results.forEach((r, idx) => {
      const w = slice[idx];
      if (r.success) {
        if (Array.isArray(r.data.orders)) {
          allOrders.push(...r.data.orders);
        }
        if (r.attempts > 0) {
          failureLog.push(
            `${w.from} → ${w.to} failed – retried ${r.attempts} times – successful`
          );
        }
      } else {
        failureLog.push(
          `${w.from} → ${w.to} failed – retried ${MAX_RETRIES} times – failed`
        );
      }
    });

    completed += slice.length;
    progressFill.style.width =
      Math.round((completed/windows.length)*100) + "%";
  }

  clearInterval(timerInterval);
  statusEl.textContent = `Completed in ${elapsed()}`;
  progressFill.style.width = "100%";
  exportBtn.style.display = "block";
  startBtn.disabled = false;

  if (failureLog.length === 0) {
    summaryEl.innerHTML =
      `<div class="ok">Completed. Total Orders: ${allOrders.length}. 0 failures.</div>`;
  } else {
    summaryEl.innerHTML =
      `<div class="warn">Completed. Total Orders: ${allOrders.length}.</div>` +
      failureLog.map(f =>
        `<div class="${f.endsWith("failed") ? "bad" : "warn"}">${f}</div>`
      ).join("");
  }
};
</script>
</body>
</html>
