<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Straight Freight – Orders Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#05070b;
  --card:#0f1420;
  --text:#e6edf6;
  --muted:#93a4b7;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --border:#1f2933;
  --ok:#10b981;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1200px 800px at 10% -10%, #121a2b 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:440px;
  background:linear-gradient(180deg,#111827,#0b1220);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
}

h1{
  margin:0 0 18px;
  font-size:20px;
}

.field{
  margin-bottom:14px;
}

label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

input[type="date"]{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
  font-size:14px;
  cursor:pointer;
}

button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  color:#fff;
}

.primary{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.secondary{
  background:linear-gradient(90deg,#334155,#475569);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.progress-wrap{
  margin-top:18px;
}

.progress-bar{
  height:10px;
  background:#0b1220;
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--ok));
  transition:width .3s ease;
}

.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
  min-height:18px;
}

.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid #334155;
  border-top-color:#22d3ee;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-right:6px;
  vertical-align:middle;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  margin-top:16px;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}
</style>
</head>

<body>
<div class="card">
  <h1>Straight Freight – Orders Export</h1>

  <div class="field">
    <label>Start Date</label>
    <input type="date" id="startDate" />
  </div>

  <div class="field">
    <label>End Date</label>
    <input type="date" id="endDate" />
  </div>

  <button id="startBtn" class="primary">Start Pull</button>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="status" id="status">
      <span class="spinner"></span>Initializing…
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <button id="exportBtn" class="secondary" style="display:none;margin-top:16px">
    Export CSV
  </button>

  <div class="footer" id="summary"></div>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const exportBtn = document.getElementById("exportBtn");
const statusEl = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const summaryEl = document.getElementById("summary");

let allOrders = [];
let startTime = null;

const addDays = (d, days) => {
  const x = new Date(d);
  x.setDate(x.getDate() + days);
  return x;
};

const parseLocal = (v) => {
  const [y,m,d] = v.split("-").map(Number);
  return new Date(y, m-1, d);
};

const fmt = (d) => d.toISOString().slice(0,10);

const elapsed = () => {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}m ${r}s`;
};

startBtn.onclick = async () => {
  const startVal = document.getElementById("startDate").value;
  const endVal = document.getElementById("endDate").value;

  if (!startVal || !endVal) {
    alert("Please select both dates.");
    return;
  }

  startBtn.disabled = true;
  exportBtn.style.display = "none";
  summaryEl.textContent = "";
  progressWrap.style.display = "block";
  progressFill.style.width = "0%";
  allOrders = [];
  startTime = Date.now();

  let cursor = parseLocal(startVal);
  const finalEnd = parseLocal(endVal);

  const totalDays =
    Math.ceil((finalEnd - cursor) / (1000 * 60 * 60 * 24)) + 1;

  let processedDays = 0;

  while (cursor <= finalEnd) {
    const batchStart = new Date(cursor);
    let batchEnd = addDays(batchStart, 29);
    if (batchEnd > finalEnd) batchEnd = new Date(finalEnd);

    const from = fmt(batchStart);
    const to = fmt(batchEnd);

    statusEl.innerHTML =
      `<span class="spinner"></span>` +
      `Pulling ${from} → ${to} | Orders: ${allOrders.length} | Elapsed: ${elapsed()}`;

    const res = await fetch(`/api/get-orders?from=${from}&to=${to}`);
    const data = await res.json();

    if (Array.isArray(data.orders)) {
      allOrders.push(...data.orders);
    }

    processedDays +=
      Math.ceil((batchEnd - batchStart) / (1000 * 60 * 60 * 24)) + 1;

    progressFill.style.width =
      Math.min((processedDays / totalDays) * 100, 100) + "%";

    cursor = addDays(batchEnd, 1);
  }

  statusEl.textContent = "Completed";
  progressFill.style.width = "100%";
  summaryEl.textContent = `Completed. Total Orders: ${allOrders.length}`;
  exportBtn.style.display = "block";
  startBtn.disabled = false;
};

exportBtn.onclick = () => {
  if (!allOrders.length) return;

  const headers = Object.keys(allOrders[0]);
  const rows = [
    headers.join(","),
    ...allOrders.map(o =>
      headers.map(h =>
        `"${String(o[h] ?? "").replace(/"/g,'""')}"`
      ).join(",")
    )
  ];

  const blob = new Blob([rows.join("\n")], { type:"text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "straight_freight_orders.csv";
  a.click();

  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
